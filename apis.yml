aid: onehealthcompany
name: OneHealthCompany
description: >-
  The One Health Company is a Palo Alto veterinary precision-oncology company,
  best known for its FidoCure platform, that brings human-grade precision cancer
  medicine to dogs. FidoCure sequences a dog's tumor with next-generation DNA
  sequencing, matches the cancer-driving mutations to targeted therapies, and
  gives veterinarians an individualized treatment plan grounded in the world's
  largest proprietary canine cancer dataset (billions of data points across a
  network of more than 1,300 veterinary clinics). The company was founded in
  2015 by Christina Lopes and Ben Lewis on the "One Health" thesis that treating
  cancer in companion dogs also advances real-world evidence for human oncology.
  It is backed by Andreessen Horowitz (a16z bio), Y Combinator, Polaris Partners,
  Borealis Ventures, Lerer Hippeau and Tau Ventures. As of this profile the
  company exposes a consumer and veterinarian web experience (including a
  veterinarian login portal) but publishes no public developer API, SDK, or
  programmatic surface.
